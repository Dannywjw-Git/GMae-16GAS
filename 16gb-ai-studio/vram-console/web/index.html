<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>16G-AI-Studio · GMae 显存指挥家</title>
  <meta name="description" content="GPU Maestro - 消费级 AI 服务器显存编排专家">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d9488'/><text x='50' y='68' font-size='50' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'>G</text></svg>">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages/common.css">
  <link rel="stylesheet" href="/css/pages/topology.css">
  <style>
    /* 初始加载状态 */
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--color-bg-0);
      z-index: 9999;
    }
    #app-loading .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--color-brand-500), var(--color-brand-700));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      color: white;
      margin-bottom: 16px;
    }
    #app-loading .title {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 8px;
    }
    #app-loading .subtitle {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-bottom: 24px;
    }
    #app-loading .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--color-brand-600);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="logo">G</div>
    <div class="title">16G-AI-Studio</div>
    <div class="subtitle">GMae 显存指挥家 · 加载中...</div>
    <div class="spinner"></div>
  </div>
  <div id="app"></div>
  <!-- 核心模块（按依赖顺序加载） -->
  <script src="/js/core/utils.js"></script>
  <script src="/js/core/eventbus.js"></script>
  <script src="/js/core/state.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/router.js"></script>
  <!-- 通用组件 -->
  <script src="/js/components/icons.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/modal.js"></script>
  <!-- 页面模块 -->
  <script src="/js/pages/pages.js"></script>
  <script src="/js/topology.js"></script>
  <!-- 应用入口 -->
  <script src="/js/app.js"></script>
  <script>
    // 应用加载完成后隐藏 loading
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loading = document.getElementById('app-loading');
        if (loading) {
          loading.style.opacity = '0';
          loading.style.transition = 'opacity 0.3s';
          setTimeout(() => loading.remove(), 300);
        }
      }, 500);
    });
  </script>
</body>
</html>
