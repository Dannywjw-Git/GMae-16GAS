name: GMae CI

on:
  push:
    branches: [main, master, develop, refactor/v2, 'audit/**']
  pull_request:
    branches: [main, master, refactor/v2]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile source and tests
        run: python -m compileall -q 16gb-ai-studio/vram-console
      - name: Check undefined names
        run: python scripts/check_python_names.py
      - name: Verify server import and registered endpoints
        working-directory: 16gb-ai-studio/vram-console
        run: python -c "import server; from api.endpoints import router; assert router.count() > 0"
      - name: Run offline regression and contract tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results.xml
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check_frontend.mjs
