name: GMae CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyflakes pycodestyle

    - name: Syntax check (py_compile)
      run: |
        cd 16gb-ai-studio/vram-console
        python -m compileall -q .
        echo "Syntax check passed"

    - name: Import check
      run: |
        cd 16gb-ai-studio/vram-console
        python -c "
        import sys
        sys.path.insert(0, '.')
        # 测试核心模块导入（不依赖外部服务）
        modules = [
            'core.config', 'core.registry', 'core.logger',
            'core.exceptions', 'core.thresholds', 'core.utils',
            'engine.gen_stats', 'engine.budget', 'engine.qos',
        ]
        failed = []
        for m in modules:
            try:
                __import__(m)
                print(f'  OK: {m}')
            except Exception as e:
                failed.append((m, str(e)))
                print(f'  FAIL: {m} - {e}')
        if failed:
            sys.exit(1)
        print(f'All {len(modules)} core modules imported successfully')
        "

    - name: Pyflakes static analysis
      run: |
        cd 16gb-ai-studio/vram-console
        pyflakes core/ engine/ services/ api/ clients/ 2>&1 | head -50 || true
        echo "Pyflakes check completed (warnings only)"

    - name: Check for print() calls
      run: |
        cd 16gb-ai-studio/vram-console
        count=$(grep -rn "print(" --include="*.py" core/ engine/ services/ api/ clients/ 2>/dev/null | wc -l)
        if [ "$count" -gt 0 ]; then
          echo "WARNING: Found $count print() calls in core modules"
          grep -rn "print(" --include="*.py" core/ engine/ services/ api/ clients/ 2>/dev/null | head -10
        else
          echo "No print() calls found in core modules"
        fi

    - name: Check file size limits
      run: |
        cd 16gb-ai-studio/vram-console
        echo "=== Files over 300 lines ==="
        find . -name "*.py" -not -path "./__pycache__/*" -not -path "./.git/*" | while read f; do
          lines=$(wc -l < "$f")
          if [ "$lines" -gt 300 ]; then
            echo "  $f: $lines lines"
          fi
        done
        echo "=== File size check completed ==="
